<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171713">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    {{ with resources.Get "css/main.css" }}
      <link rel="stylesheet" href="{{ .RelPermalink }}">
    {{ else }}
      <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
    {{ end }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-header-meta">
        <a class="wordmark" href="{{ "" | relURL }}" aria-label="{{ site.Title }} home">
          <span>Karim</span> <span class="wordmark-accent">Ben Boubaker</span>
        </a>
        <span class="site-status" aria-label="Site status">alpha / reset</span>
      </div>
      {{ partial "site-nav.html" . }}
    </header>

    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="site-footer">
      <span>{{ site.Title }}</span>
      <span>Hugo · {{ now.Year }}</span>
    </footer>
  </body>
</html>
